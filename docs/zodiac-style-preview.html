<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>星座设计方向预览</title>
<style>
  body { margin:0; padding:28px; background:#05070d; color:#eef6ff; font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif; }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:#8292ab; font-size:12px; margin-bottom:22px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:18px; }
  .card { border:1px solid rgba(125,164,207,.18); border-radius:16px; padding:20px; }
  .card h3 { margin:0 0 4px; font-size:15px; }
  .card p { margin:0 0 14px; color:#8292ab; font-size:11px; line-height:1.5; }
  .card svg { width:100%; height:200px; display:block; }
  .name { text-align:center; font-size:13px; margin-top:8px; letter-spacing:.04em; }
  .name em { display:block; font-style:normal; font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:#8292ab; }
</style>
</head>
<body>
<h1>星座设计方向（Leo 狮子座）</h1>
<div class="sub">5 种风格来自 design-system-library · 选一个告诉我编号</div>
<div class="grid" id="grid"></div>
<script>
const LEO = [[[95,95],[95,140],[150,140],[150,95],[95,95]], [[150,140],[175,165],[185,195]]];
function smoothD(pts){
  let d = `M ${pts[0][0]} ${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[Math.max(0,i-1)], p1=pts[i], p2=pts[i+1], p3=pts[Math.min(pts.length-1,i+2)];
    d += ` C ${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)} ${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)}, ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)} ${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)}, ${p2[0]} ${p2[1]}`;
  }
  return d;
}
function starPts(cx,cy,R){const p=[];for(let k=0;k<10;k++){const rr=k%2===0?R:R*0.45;const a=-Math.PI/2+k*Math.PI/5;p.push(`${(cx+rr*Math.cos(a)).toFixed(1)},${(cy+rr*Math.sin(a)).toFixed(1)}`);}return p.join(' ');}

const styles = [
  { name:"① Cosmic 宇宙科幻", desc:"深黑底 + 霓虹蓝紫渐变光晕，星点发光，科技感", bg:"#060a18", line:"#6ea8ff", line2:"#a78bfa", glow:true, star:true, ring:"#3b82f6" },
  { name:"② SpaceX 极简星空", desc:"纯黑 + 光谱白星芒，无彩色、极简克制", bg:"#000000", line:"rgba(240,240,250,.55)", line2:"rgba(240,240,250,.35)", glow:false, star:false, ring:"rgba(240,240,250,.3)" },
  { name:"③ Luxury 奢华", desc:"纯黑 + 暖金细线，低调高级", bg:"#0a0908", line:"#e8c46a", line2:"#c9a24a", glow:true, star:true, ring:"#e8c46a" },
  { name:"④ Neon 霓虹", desc:"青柠绿 + 电光蓝，高对比强发光", bg:"#04070a", line:"#bbf351", line2:"#00bcff", glow:true, star:true, ring:"#00bcff" },
  { name:"⑤ Glass 玻璃", desc:"磨砂玻璃质感，柔和蓝光，轻盈通透", bg:"#0d1626", line:"rgba(120,170,255,.6)", line2:"rgba(120,170,255,.35)", glow:true, star:true, ring:"#1856ff" },
];

const grid = document.getElementById('grid');
styles.forEach((s) => {
  let paths = LEO.map(p=>`<path d='${smoothD(p)}'/>`).join('');
  // 星点
  let stars = '';
  LEO.flat().forEach((p,i)=>{
    const b = 0.45 + ((i*37)%10)/10*0.55;
    const R = 4.5 + b*5;
    if(s.star){
      const glow = b>0.6 ? `<circle cx='${p[0]}' cy='${p[1]}' r='${(R*1.9).toFixed(1)}' fill='${s.line}' opacity='0.18'/>` : '';
      stars += glow + `<polygon points='${starPts(p[0],p[1],R)}' fill='${s.line}' opacity='${b.toFixed(2)}'/>`;
    } else {
      stars += `<circle cx='${p[0]}' cy='${p[1]}' r='${(1.5+b*2).toFixed(1)}' fill='#f0f0fa' opacity='${b.toFixed(2)}'/>`;
    }
  });
  const g = s.glow ? `<circle cx='125' cy='125' r='70' fill='url(#g-${s.name})' opacity='0.15'/>` : '';
  const grad = s.glow ? `<radialGradient id='g-${s.name}'><stop offset='0%' stop-color='${s.line2||s.line}'/><stop offset='100%' stop-color='transparent'/></radialGradient>` : '';
  grid.innerHTML += `<div class="card" style="background:${s.bg};border-color:rgba(125,164,207,.14)">
    <h3>${s.name}</h3><p>${s.desc}</p>
    <svg viewBox="0 0 250 250" fill="none">${grad}${g}<g stroke='${s.line}' stroke-width='1.3' stroke-linecap='round' opacity='.55' fill='none'>${paths}</g>${stars}<circle cx='125' cy='125' r='100' stroke='${s.ring}' stroke-width='1' opacity='.15'/></svg>
    <div class="name">狮子座<em>LEO</em></div>
  </div>`;
});
</script>
</body>
</html>
